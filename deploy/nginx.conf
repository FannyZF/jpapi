# Japan Customs API Hub - Nginx 配置模板
# 使用方式: 复制到 /etc/nginx/sites-available/api-hub 然后 ln -s 到 sites-enabled

server {
    listen 80;
    server_name your-domain.com;

    # HTTP -> HTTPS 重定向 (启用 HTTPS 时取消注释)
    # return 301 https://$host$request_uri;
}

